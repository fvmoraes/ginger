name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Force bump type (skip to disable)'
        required: false
        type: choice
        options: [auto, major, minor, patch, skip]
        default: auto

permissions: {}

# GIN-017: uma run por ref; a segunda espera (não cria estado inconsistente).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    # R2 (GIN-001): o commit de versionamento é feito pelo bot — condição +
    # [skip ci] na mensagem evitam re-disparo em loop.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    outputs:
      bump: ${{ steps.bump.outputs.type }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      run_config: ${{ steps.runconfig.outputs.run_config }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25'

      - name: Determine bump type
        id: bump
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            case "${{ inputs.bump }}" in
              major|minor|patch) echo "type=${{ inputs.bump }}" >> $GITHUB_OUTPUT; exit 0 ;;
              skip) echo "type=skip" >> $GITHUB_OUTPUT; exit 0 ;;
            esac
          fi

          LATEST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [[ -z "$LATEST_TAG" ]]; then
            echo "No tags found — skipping"
            echo "type=skip" >> $GITHUB_OUTPUT
            exit 0
          fi

          if git describe --tags --exact-match HEAD >/dev/null 2>&1; then
            echo "HEAD already tagged — skipping"
            echo "type=skip" >> $GITHUB_OUTPUT
            exit 0
          fi

          COMMITS=$(git log --pretty=format:'%s' "$LATEST_TAG..HEAD")
          if [[ -z "$COMMITS" ]]; then
            echo "No new commits since $LATEST_TAG — skipping"
            echo "type=skip" >> $GITHUB_OUTPUT
            exit 0
          fi

          HAS_BREAKING=$(echo "$COMMITS" | grep -cE '^[a-z]+(\(.+\))?!:' || true)
          HAS_FEAT=$(echo "$COMMITS" | grep -cE '^feat(\(.+\))?:' || true)
          HAS_FIX=$(echo "$COMMITS" | grep -cE '^fix(\(.+\))?:' || true)

          if [[ $HAS_BREAKING -gt 0 ]]; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif [[ $HAS_FEAT -gt 0 ]]; then
            echo "type=minor" >> $GITHUB_OUTPUT
          elif [[ $HAS_FIX -gt 0 ]]; then
            echo "type=patch" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi

          echo "Commits since $LATEST_TAG: $(echo "$COMMITS" | wc -l)"
          echo "Breaking: $HAS_BREAKING  Feat: $HAS_FEAT  Fix: $HAS_FIX"

      - name: Compute new version
        id: version
        if: steps.bump.outputs.type != 'skip'
        run: |
          LATEST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          VERSION_RAW="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_RAW"

          case "${{ steps.bump.outputs.type }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          NEW_TAG="v$NEW_VERSION"

          if git ls-remote --tags origin "refs/tags/$NEW_TAG" | grep -q "$NEW_TAG"; then
            echo "::error::Tag $NEW_TAG already exists on origin — aborting (previous release partially done?)"
            exit 1
          fi

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "New version: $NEW_TAG"

      - name: Update version files
        if: steps.bump.outputs.type != 'skip'
        run: |
          echo "${{ steps.version.outputs.version }}" > internal/buildinfo/version.txt
          sed -i "s/version-[0-9]\+\.[0-9]\+\.[0-9]\+-blue/version-${{ steps.version.outputs.version }}-blue/g" README.md

      - name: Update CHANGELOG and prepare release body
        if: steps.bump.outputs.type != 'skip'
        run: |
          LATEST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          DATE=$(date -u +%Y-%m-%d)
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"
          COMMITS=$(git log --pretty=format:'%s' "$LATEST_TAG..HEAD")

          case "${{ steps.bump.outputs.type }}" in
            major) SECTION="Changed" ;;
            minor) SECTION="Added" ;;
            patch) SECTION="Fixed" ;;
          esac

          HAS_FEAT=$(echo "$COMMITS" | grep -cE '^feat(\(.+\))?:' || true)
          HAS_FIX=$(echo "$COMMITS" | grep -cE '^fix(\(.+\))?:' || true)

          if [[ $HAS_FEAT -gt 0 && $HAS_FIX -gt 0 ]]; then
            MSG="Feature improvements and bug fixes"
          elif [[ $HAS_FEAT -gt 0 ]]; then
            MSG="New features and developer experience improvements"
          elif [[ $HAS_FIX -gt 0 ]]; then
            MSG="Bug fixes and reliability improvements"
          else
            MSG="Maintenance and internal improvements"
          fi

          ENTRY=$'## ['$VERSION$'] - '$DATE$'\n\n### '$SECTION$'\n- '$MSG$'\n\n### Commit Summary'
          while IFS= read -r line; do
            ENTRY+=$'\n- '$line
          done <<< "$COMMITS"
          ENTRY+=$'\n'

          awk -v entry="$ENTRY" '
            BEGIN { inserted=0 }
            {
              if (!inserted && $0 ~ /^## \[/) {
                print entry
                inserted=1
              }
              print
            }
          ' CHANGELOG.md > CHANGELOG.md.tmp && mv CHANGELOG.md.tmp CHANGELOG.md

          if ! grep -q "\[$VERSION\]:" CHANGELOG.md; then
            echo "[$VERSION]: https://github.com/${{ github.repository }}/releases/tag/$TAG" >> CHANGELOG.md
          fi

          {
            echo "### ${SECTION}"
            echo "- ${MSG}"
            echo
            echo "### Commit Summary"
            while IFS= read -r line; do echo "- $line"; done <<< "$COMMITS"
          } > body.md

      - name: Save release body
        if: steps.bump.outputs.type != 'skip'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-body
          path: body.md
          retention-days: 5

      - name: Commit version files, tag, and push (GIN-001)
        if: steps.bump.outputs.type != 'skip'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add internal/buildinfo/version.txt README.md CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No version file changes to commit"
          else
            git commit -m "release: v${VERSION} [skip ci]"
            git push origin "HEAD:main"
          fi

          git tag -a "$TAG" -m "Release $VERSION"
          git push origin "$TAG"

      - name: Emit SLSA run-config (Fase 5 — provenance)
        id: runconfig
        if: steps.bump.outputs.type != 'skip'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          {
            echo 'run_config<<EOF_RUNCONFIG'
            cat <<'YAML' | sed "s/__VERSION__/${VERSION}/g"
          version: 1
          runner: ubuntu-latest
          command: |
            set -euo pipefail
            mkdir -p dist
            for platform in "linux/amd64" "linux/arm64" "darwin/amd64" "darwin/arm64" "windows/amd64"; do
              GOOS="${platform%/*}"; GOARCH="${platform#*/}"
              OUT="dist/ginger-$GOOS-$GOARCH"
              [[ "$GOOS" == "windows" ]] && OUT+=".exe"
              echo "  → $GOOS/$GOARCH → $OUT"
              GOOS="$GOOS" GOARCH="$GOARCH" \
                go build -ldflags="-s -w -X github.com/fvmoraes/ginger/internal/buildinfo.releaseVersion=__VERSION__" \
                -o "$OUT" ./cmd/ginger
            done
            ( cd dist && shasum -a 256 ginger-* > checksums.txt )
          YAML
            echo 'EOF_RUNCONFIG'
          } >> "$GITHUB_OUTPUT"

  # Fase 5: SLSA L3 provenance — the reusable builder controls the build.
  build:
    needs: [prepare]
    if: needs.prepare.outputs.bump != 'skip'
    permissions:
      id-token: write # for SLSA provenance
      contents: write
      actions: read
    uses: slsa-framework/slsa-github-generator/.github/workflows/generic_slsa3.yml@5a775b367a56d5bd118a224a811bba288150a563 # v2.0.0
    with:
      go-version: "1.25"
      run-config: ${{ needs.prepare.outputs.run_config }}
    secrets: inherit

  release:
    needs: [build, prepare]
    if: needs.prepare.outputs.bump != 'skip'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built artifacts (dist/ + provenance)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: dist*
          merge-multiple: true
          path: dist

      - name: Download release body
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-body
          path: .

      - name: List artifacts
        run: ls -la dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Ginger Framework ${{ needs.prepare.outputs.tag }}
          body_path: body.md
          files: |
            dist/*
          make_latest: true

      - name: Attach SBOM (SPDX, GIN-018)
        uses: anchore/sbom-action@df80a981bc6edbc4e220a492d3cbe9f5547a6e75 # v0.17.9
        with:
          format: spdx-json
          artifact-name: ginger-${{ needs.prepare.outputs.version }}.spdx.json
