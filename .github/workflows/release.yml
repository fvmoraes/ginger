name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Force bump type (skip to disable)'
        required: false
        type: choice
        options: [auto, major, minor, patch, skip]
        default: auto

permissions:
  contents: write

# GIN-017: uma run por ref; a segunda espera (não cria estado inconsistente).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # R2 (GIN-001): o commit de versionamento é feito pelo bot — esta condição
    # evita re-disparo em loop; [skip ci] na mensagem é a segunda barreira.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-go@3041bf56c941b39c61721a86cd11f3bb1338122a # v5.2.0
        with:
          go-version: '1.25'

      - name: Determine bump type
        id: bump
        run: |
          # Force override from manual dispatch
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            case "${{ inputs.bump }}" in
              major|minor|patch) echo "type=${{ inputs.bump }}" >> $GITHUB_OUTPUT; exit 0 ;;
              skip) echo "type=skip" >> $GITHUB_OUTPUT; exit 0 ;;
            esac
          fi

          # Get latest tag
          LATEST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          if [[ -z "$LATEST_TAG" ]]; then
            echo "No tags found — skipping"
            echo "type=skip" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if current HEAD is already tagged
          if git describe --tags --exact-match HEAD >/dev/null 2>&1; then
            echo "HEAD already tagged — skipping"
            echo "type=skip" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Analyze conventional commits since last tag
          COMMITS=$(git log --pretty=format:'%s' "$LATEST_TAG..HEAD")
          if [[ -z "$COMMITS" ]]; then
            echo "No new commits since $LATEST_TAG — skipping"
            echo "type=skip" >> $GITHUB_OUTPUT
            exit 0
          fi

          HAS_BREAKING=$(echo "$COMMITS" | grep -cE '^[a-z]+(\(.+\))?!:' || true)
          HAS_FEAT=$(echo "$COMMITS" | grep -cE '^feat(\(.+\))?:' || true)
          HAS_FIX=$(echo "$COMMITS" | grep -cE '^fix(\(.+\))?:' || true)

          if [[ $HAS_BREAKING -gt 0 ]]; then
            echo "type=major" >> $GITHUB_OUTPUT
          elif [[ $HAS_FEAT -gt 0 ]]; then
            echo "type=minor" >> $GITHUB_OUTPUT
          elif [[ $HAS_FIX -gt 0 ]]; then
            echo "type=patch" >> $GITHUB_OUTPUT
          else
            echo "type=patch" >> $GITHUB_OUTPUT
          fi

          echo "Commits since $LATEST_TAG: $(echo "$COMMITS" | wc -l)"
          echo "Breaking: $HAS_BREAKING  Feat: $HAS_FEAT  Fix: $HAS_FIX"

      - name: Compute new version
        id: version
        if: steps.bump.outputs.type != 'skip'
        run: |
          LATEST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          VERSION_RAW="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_RAW"

          case "${{ steps.bump.outputs.type }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          NEW_TAG="v$NEW_VERSION"

          # GIN-017: proteção contra tag duplicada (reexecuções/races).
          if git ls-remote --tags origin "refs/tags/$NEW_TAG" | grep -q "$NEW_TAG"; then
            echo "::error::Tag $NEW_TAG already exists on origin — aborting (previous release partially done?)"
            exit 1
          fi

          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "New version: $NEW_TAG"

      - name: Update version files
        if: steps.bump.outputs.type != 'skip'
        run: |
          echo "${{ steps.version.outputs.version }}" > internal/buildinfo/version.txt
          sed -i "s/version-[0-9]\+\.[0-9]\+\.[0-9]\+-blue/version-${{ steps.version.outputs.version }}-blue/g" README.md

      - name: Update CHANGELOG and prepare release body
        if: steps.bump.outputs.type != 'skip'
        run: |
          LATEST_TAG=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          DATE=$(date -u +%Y-%m-%d)
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"
          COMMITS=$(git log --pretty=format:'%s' "$LATEST_TAG..HEAD")

          case "${{ steps.bump.outputs.type }}" in
            major) SECTION="Changed" ;;
            minor) SECTION="Added" ;;
            patch) SECTION="Fixed" ;;
          esac

          HAS_FEAT=$(echo "$COMMITS" | grep -cE '^feat(\(.+\))?:' || true)
          HAS_FIX=$(echo "$COMMITS" | grep -cE '^fix(\(.+\))?:' || true)

          if [[ $HAS_FEAT -gt 0 && $HAS_FIX -gt 0 ]]; then
            MSG="Feature improvements and bug fixes"
          elif [[ $HAS_FEAT -gt 0 ]]; then
            MSG="New features and developer experience improvements"
          elif [[ $HAS_FIX -gt 0 ]]; then
            MSG="Bug fixes and reliability improvements"
          else
            MSG="Maintenance and internal improvements"
          fi

          # Build changelog entry
          ENTRY=$'## ['$VERSION$'] - '$DATE$'\n\n### '$SECTION$'\n- '$MSG$'\n\n### Commit Summary'
          while IFS= read -r line; do
            ENTRY+=$'\n- '$line
          done <<< "$COMMITS"
          ENTRY+=$'\n'

          awk -v entry="$ENTRY" '
            BEGIN { inserted=0 }
            {
              if (!inserted && $0 ~ /^## \[/) {
                print entry
                inserted=1
              }
              print
            }
          ' CHANGELOG.md > CHANGELOG.md.tmp && mv CHANGELOG.md.tmp CHANGELOG.md

          if ! grep -q "\[$VERSION\]:" CHANGELOG.md; then
            echo "[$VERSION]: https://github.com/${{ github.repository }}/releases/tag/$TAG" >> CHANGELOG.md
          fi

          # GIN-017: corpo do release com o mesmo conteúdo do changelog.
          {
            echo "### ${SECTION}"
            echo "- ${MSG}"
            echo
            echo "### Commit Summary"
            while IFS= read -r line; do echo "- $line"; done <<< "$COMMITS"
          } > body.md

      - name: "Build binaries (D-09 — artifacts live in dist/, never tracked)"
        if: steps.bump.outputs.type != 'skip'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DIST_DIR="dist"
          mkdir -p "$DIST_DIR"

          for platform in "linux/amd64" "linux/arm64" "darwin/amd64" "darwin/arm64" "windows/amd64"; do
            IFS='/' read -r GOOS GOARCH <<< "$platform"
            OUTPUT="$DIST_DIR/ginger-$GOOS-$GOARCH"
            [[ "$GOOS" == "windows" ]] && OUTPUT+=".exe"
            echo "  → $GOOS/$GOARCH → $OUTPUT"
            GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -ldflags="-s -w -X github.com/fvmoraes/ginger/internal/buildinfo.releaseVersion=$VERSION" \
              -o "$OUTPUT" ./cmd/ginger
          done

          cd "$DIST_DIR"
          shasum -a 256 ginger-* > checksums.txt

      - name: Commit version files, tag, and push (GIN-001)
        if: steps.bump.outputs.type != 'skip'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # A tag passa a apontar para um commit que CONTÉM os metadados da
          # própria versão (version.txt/badge/CHANGELOG coerentes).
          git add internal/buildinfo/version.txt README.md CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No version file changes to commit"
          else
            git commit -m "release: v${VERSION} [skip ci]"
            git push origin "HEAD:main"
          fi

          git tag -a "$TAG" -m "Release $VERSION"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: steps.bump.outputs.type != 'skip'
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Ginger Framework ${{ steps.version.outputs.tag }}
          body_path: body.md
          files: |
            dist/ginger-linux-amd64
            dist/ginger-linux-arm64
            dist/ginger-darwin-amd64
            dist/ginger-darwin-arm64
            dist/ginger-windows-amd64.exe
            dist/checksums.txt
          make_latest: true

      - name: Attach SBOM (SPDX, GIN-018)
        if: steps.bump.outputs.type != 'skip'
        uses: anchore/sbom-action@df80a981bc6edbc4e220a492d3cbe9f5547a6e75 # v0.17.9
        with:
          format: spdx-json
          artifact-name: ginger-${{ steps.version.outputs.version }}.spdx.json
